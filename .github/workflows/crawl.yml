name: crawl-and-deploy

on:
  schedule:
    - cron: '0 22,6 * * *'   # UTC 22:00, 06:00 = 한국시간 07:00, 15:00 (하루 2회)
  workflow_dispatch: {}       # 수동 실행 버튼

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: crawl-and-deploy
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 수집·요약
        run: node src/crawl.js --limit 15
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # 없으면 규칙 기반 요약
      - name: 데이터 커밋
        run: |
          git config user.name "news-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/posts.json
          git diff --cached --quiet || git commit -m "data: update $(date -u +%F-%H%M)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
