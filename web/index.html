<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공고모아 · 성북·강북 지원사업·강사모집 공고를 한곳에서</title>
<meta name="description" content="성북구·강북구 기관의 지원사업, 공모, 강사모집, 채용, 프로그램 공고를 모아 마감일 순으로 보여 주는 서비스입니다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#main">본문 바로가기</a>
<div id="site-header"></div>

<main id="main">
  <div class="container">
    <section class="hero" aria-label="서비스 소개">
      <h1 id="heroTitle">성북·강북 <em>지원사업·강사모집</em><br>공고를 한곳에서</h1>
      <p>흩어져 있던 기관 공고를 모아 마감일 기준으로 정리했습니다. 지금 신청할 수 있는 공고부터 확인하세요.</p>
      <div class="stats" id="stats"></div>
    </section>

    <div data-ad="top"></div>

    <div class="layout">
      <section aria-label="공고 목록">
        <div class="top">
          <div class="top-row">
            <label class="search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
              <input id="q" type="search" placeholder="제목·내용 검색 (예: 강사, 공예, 청년)" aria-label="공고 검색">
            </label>
            <button class="btn" id="filt" aria-expanded="false" aria-controls="panel">필터 <b id="fcnt"></b> ▾</button>
          </div>
          <div class="active" id="active" hidden></div>
        </div>
        <div id="panel" hidden>
          <div class="chips" id="reg"></div>
          <div class="chips" id="cat"></div>
          <div class="chips" id="aud"></div>
          <div class="chips" id="stt"></div>
          <div class="chips"><span class="label">기관</span><button class="chip" id="srcBtn"></button></div>
          <div class="srcs" id="srcs" hidden></div>
        </div>
        <div class="bar"><span id="count"></span><span class="ctl"><span id="views"></span><span id="sorts"></span><span id="sizes"></span></span></div>
        <div id="list"></div>
        <div class="pager" id="pager"></div>
      </section>

      <aside class="side" aria-label="추천 정보">
        <div class="widget"><h3>⏰ 마감 임박</h3><ul class="wl" id="wSoon"></ul></div>
        <div data-ad="side"></div>
        <div class="widget"><h3>수집 기관</h3><div class="wsrc" id="wSrc"></div></div>
        <div class="widget"><p class="hint">북마크와 선택한 필터는 이 브라우저에만 저장됩니다. 기기를 바꾸면 다시 설정해야 합니다.</p></div>
      </aside>
    </div>

    <div data-ad="footer"></div>
  </div>
</main>

<div id="site-footer"></div>
<button id="totop" aria-label="맨 위로">↑</button>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="layout.js"></script>
<script src="app.js"></script>
</body>
</html>
